# Publishes the site to Cloudflare Pages on every push to main.
# One-time setup in GitHub: Settings > Secrets and variables > Actions > New repository secret
#   CLOUDFLARE_API_TOKEN   (Cloudflare > My Profile > API Tokens > "Edit Cloudflare Pages" permission)
#   CLOUDFLARE_ACCOUNT_ID  (Cloudflare dashboard > Workers & Pages, right-hand side)
# Optional repository variable PAGES_PROJECT if your Pages project is not named "mclearn-media".
name: Deploy to Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: cloudflare-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage public files only
        run: |
          mkdir -p public
          rsync -a --exclude-from=.assetsignore --exclude public ./ public/
      - name: Pre-flight check
        run: |
          for f in index.html arena/index.html listen.html legal.html 404.html _headers _redirects; do
            test -s "public/$f" || { echo "::error::missing $f"; exit 1; }
          done
          grep -q "34 games" public/arena/index.html || { echo "::error::Arena build is not the 34-game version"; exit 1; }
          echo "Ready: $(find public -type f | wc -l) files, $(du -sh public | cut -f1)"
      - name: Deploy
        if: ${{ env.HAS_TOKEN == 'true' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=${{ vars.PAGES_PROJECT || 'mclearn-media' }} --branch=main --commit-dirty=true
      - name: Setup reminder
        if: ${{ env.HAS_TOKEN != 'true' }}
        run: echo "::warning::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable deploys."
